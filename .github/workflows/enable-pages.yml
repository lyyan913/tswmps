name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  enable-legacy:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.legacy.outputs.enabled }}
    steps:
      - name: Enable Pages from the default branch root
        id: legacy
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const source = { branch: "main", path: "/" };

            const existing = await github.rest.repos.getPages({ owner, repo }).catch((error) => {
              core.warning(`getPages status=${error.status} message=${error.message}`);
              return null;
            });

            if (existing && existing.data.build_type === "legacy" && existing.data.source && existing.data.source.branch === "main" && existing.data.source.path === "/") {
              core.info(`Pages already serves ${existing.data.html_url}`);
              core.setOutput("enabled", "true");
              return;
            }

            const created = await github.rest.repos.createPagesSite({
              owner,
              repo,
              build_type: "legacy",
              source
            });
            core.info(`Created ${created.data.html_url} build_type=${created.data.build_type}`);
            core.setOutput("enabled", "true");

  deploy:
    needs: enable-legacy
    if: needs.enable-legacy.outputs.enabled != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare site root
        run: |
          mkdir -p _site
          cp index.html _site/index.html

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
