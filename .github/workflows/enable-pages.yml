name: Publish GitHub Pages

on:
  push:
    branches:
      - main
      - "None"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  enable:
    runs-on: ubuntu-latest
    outputs:
      html_url: ${{ steps.pages.outputs.html_url }}
    steps:
      - name: Enable GitHub Actions Pages
        id: pages
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const existing = await github.rest.repos.getPages({ owner, repo }).catch((error) => {
              core.warning(`getPages status=${error.status} message=${error.message}`);
              return null;
            });
            if (existing) {
              core.info(`existing html_url=${existing.data.html_url} build_type=${existing.data.build_type} source=${JSON.stringify(existing.data.source)}`);
              core.setOutput("html_url", existing.data.html_url || "");
              return;
            }

            try {
              const created = await github.rest.repos.createPagesSite({
                owner,
                repo,
                build_type: "workflow"
              });
              core.info(`created html_url=${created.data.html_url} build_type=${created.data.build_type}`);
              core.setOutput("html_url", created.data.html_url || "");
            } catch (error) {
              const accepted = error.response && error.response.headers && error.response.headers["x-accepted-github-permissions"];
              core.setFailed(`createPagesSite status=${error.status} message=${error.message} accepted=${accepted || ""}`);
            }

  deploy:
    needs: enable
    if: github.ref_name == 'None'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare site root
        run: |
          mkdir -p _site
          cp index.html _site/index.html

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
